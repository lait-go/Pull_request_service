services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: lait
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lait"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_SOURCE: postgres://lait:123@db:5432/orders_db?sslmode=disable
      URL: 0.0.0.0:8080
      LOGGER_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
